<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>میز ارز | بازار لحظه‌ای ارز و کریپتو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#000000; --bg-soft:#0a0b0d; --card:#0c0d10; --card-hover:#131519;
    --border:rgba(255,255,255,.16); --border-strong:rgba(255,255,255,.30);
    --text:#f2f1ed; --text-dim:#8b8d93; --text-faint:#54565c;
    --gold:#d8b45a; --gold-soft:#8a713a; --gold-glow:rgba(216,180,90,.08);
    --up:#2fd480; --up-soft:rgba(47,212,128,.12);
    --down:#f0576a; --down-soft:rgba(240,87,106,.12);
    --shadow: 0 16px 40px -18px rgba(0,0,0,.8);
  }
  :root[data-theme="light"]{
    --bg:#f3f1ea; --bg-soft:#ebe8de; --card:#ffffff; --card-hover:#faf8f2;
    --border:rgba(30,25,10,.16); --border-strong:rgba(30,25,10,.28);
    --text:#1b1a16; --text-dim:#6a6a63; --text-faint:#9c9a8f;
    --gold:#9c7a1f; --gold-soft:#c7a94f; --gold-glow:rgba(156,122,31,.07);
    --up:#158a52; --up-soft:rgba(21,138,82,.1);
    --down:#c73c4c; --down-soft:rgba(199,60,76,.09);
    --shadow: 0 16px 40px -18px rgba(60,50,10,.22);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{ background:#000000; }
  html,body{ min-height:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    transition:background .35s ease, color .35s ease;
    min-height:100vh;
    padding-bottom:56px;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---------- tech / circuit background ---------- */
  .bg-fx{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; opacity:1; transition:opacity .35s ease; }
  :root[data-theme="light"] .bg-fx{ opacity:.35; }

  .bg-grid{
    position:absolute; inset:-2px;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px),
      linear-gradient(rgba(216,180,90,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216,180,90,.07) 1px, transparent 1px);
    background-size: 42px 42px, 42px 42px, 252px 252px, 252px 252px;
    mask-image: radial-gradient(1200px 720px at 50% 0%, #000 45%, transparent 92%);
    -webkit-mask-image: radial-gradient(1200px 720px at 50% 0%, #000 45%, transparent 92%);
  }
  .bg-glow{
    position:absolute; inset:0;
    background:
      radial-gradient(560px 420px at 90% 4%, rgba(216,180,90,.10), transparent 65%),
      radial-gradient(520px 460px at 4% 30%, rgba(47,212,128,.06), transparent 65%),
      radial-gradient(600px 500px at 60% 100%, rgba(90,140,216,.05), transparent 70%);
  }
  .bg-dots{
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(216,180,90,.5) 1px, transparent 1.4px);
    background-size:126px 126px;
    background-position:21px 21px;
    mask-image: radial-gradient(1000px 600px at 50% 0%, #000 35%, transparent 90%);
    -webkit-mask-image: radial-gradient(1000px 600px at 50% 0%, #000 35%, transparent 90%);
    opacity:.5;
  }
  .bg-scan{
    position:absolute; left:0; right:0; height:130px; top:-130px;
    background:linear-gradient(180deg, transparent, rgba(216,180,90,.05) 40%, rgba(216,180,90,.14) 50%, rgba(216,180,90,.05) 60%, transparent);
    mix-blend-mode:screen;
    animation:scanSweep 9s linear infinite;
  }
  @keyframes scanSweep{ 0%{ transform:translateY(0);} 100%{ transform:translateY(calc(100vh + 260px));} }

  header, main, footer{ position:relative; z-index:1; }
  .ticker-wrap{ position:relative; z-index:1; }
  .num{ font-family:'JetBrains Mono', monospace; direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
  ::selection{ background:var(--gold); color:#100c00; }

  /* ---------- ticker tape ---------- */
  .ticker-wrap{
    background:var(--bg-soft);
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    overflow:hidden;
    white-space:nowrap;
    height:36px;
    display:flex;
    align-items:center;
    position:relative;
  }
  .ticker-track{
    display:inline-flex;
    align-items:center;
    animation:scrollTicker 34s linear infinite;
    will-change: transform;
  }
  .ticker-wrap:hover .ticker-track{ animation-play-state: paused; }
  @keyframes scrollTicker{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }
  .ticker-item{
    display:inline-flex; align-items:center; gap:9px;
    padding:0 20px;
    font-size:12px; color:var(--text-dim);
    border-left:1px solid var(--border);
  }
  .ticker-item b{ font-weight:700; color:var(--text); letter-spacing:.3px; }
  .ticker-item .chg-up{ color:var(--up); }
  .ticker-item .chg-down{ color:var(--down); }

  /* ---------- header ---------- */
  .header-wrap{ max-width:1160px; margin:20px auto 0; padding:0 24px; }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border:1px solid var(--border); border-radius:14px; background:var(--card);
    padding:16px 20px;
  }
  .brand{ display:flex; align-items:center; gap:13px; }
  .brand-mark{
    width:40px; height:40px; border-radius:10px;
    background:var(--gold); color:#0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0; font-weight:800;
  }
  .brand-text h1{ font-size:18px; font-weight:800; letter-spacing:.1px; }
  .brand-text span{ font-size:11.5px; color:var(--text-faint); }

  .header-tools{ display:flex; align-items:center; gap:8px; }
  .clock-box{
    display:flex; flex-direction:column; align-items:flex-end;
    padding:6px 14px; border:1px solid var(--border); border-radius:9px;
    background:transparent; min-width:104px;
  }
  .clock-box .t{ font-size:14px; font-weight:600; }
  .clock-box .d{ font-size:10px; color:var(--text-faint); margin-top:1px; }

  .icon-btn{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--border);
    background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; transition:.2s;
  }
  .icon-btn:hover{ background:var(--card-hover); border-color:var(--border-strong); }

  .search-box{
    display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--border); border-radius:9px;
    padding:0 12px; height:36px; min-width:180px;
  }
  .search-box input{
    border:none; background:transparent; outline:none; color:var(--text);
    font-family:'Vazirmatn'; font-size:12.5px; width:100%;
  }
  .search-box input::placeholder{ color:var(--text-faint); }

  main{ max-width:1160px; margin:0 auto; padding:32px 24px 0; }

  /* ---------- hero converter ---------- */
  .hero{
    position:relative;
    border:1px solid var(--border); border-radius:18px;
    background:var(--card);
    padding:26px 26px 22px;
    margin-bottom:40px;
  }
  .hero-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .hero-head h2{ font-size:15.5px; font-weight:700; display:flex; align-items:center; gap:9px; }
  .hero-head h2 .dot{ width:7px; height:7px; border-radius:50%; background:var(--up); box-shadow:0 0 0 4px var(--up-soft); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .hero-head .sub{ font-size:11.5px; color:var(--text-faint); }

  .conv-grid{
    display:grid; grid-template-columns:1fr 46px 1fr; gap:12px; align-items:center;
  }
  @media(max-width:720px){ .conv-grid{ grid-template-columns:1fr; } .swap-btn{ margin:6px auto; transform:rotate(90deg);} }
  .conv-field label{ display:block; font-size:11px; color:var(--text-faint); margin-bottom:9px; letter-spacing:.2px; }
  .conv-panel{
    border:1px solid var(--border); border-radius:12px; background:var(--bg-soft);
    padding:14px 16px; height:100%;
  }
  .conv-panel input[type=text]{
    width:100%; border:none; background:transparent; outline:none; color:var(--text);
    font-family:'JetBrains Mono'; font-size:24px; font-weight:600; direction:ltr; text-align:left;
  }
  .conv-select{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    border-top:1px solid var(--border); padding-top:10px;
  }
  .conv-select select{
    flex:1; border:none; background:transparent; color:var(--text);
    border-radius:0; padding:2px 0; font-family:'Vazirmatn'; font-size:12.5px; outline:none; cursor:pointer;
  }
  .conv-select select option, .conv-select select optgroup{
    color:#12141a; background:#ffffff;
  }
  .swap-btn{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--border);
    background:var(--gold); color:#0a0a0a; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.25s; margin:0 auto;
  }
  .swap-btn:hover{ background:var(--text); }

  .rate-line{
    margin-top:20px; padding-top:16px; border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:12px; color:var(--text-dim);
  }
  .rate-line b{ color:var(--gold); font-weight:600; }
  .updated-tag{ display:flex; align-items:center; gap:6px; color:var(--text-faint); font-size:11px;}
  .updated-tag .dotsm{ width:5px; height:5px; border-radius:50%; background:var(--up); }

  /* ---------- section ---------- */
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:0 0 16px; padding-top:8px; }
  .section-head h3{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:9px; }
  .section-head h3 .badge{
    font-size:10px; font-weight:700; color:var(--gold); border:1px solid var(--border-strong);
    border-radius:5px; padding:2px 8px; font-family:'JetBrains Mono'; letter-spacing:.5px;
  }
  .section-head .count{ font-size:11.5px; color:var(--text-faint); }

  section.block{ margin-bottom:40px; }

  .grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
  @media(max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:560px){ .grid{ grid-template-columns:1fr;} }

  .card{
    border:1px solid var(--border); border-radius:14px; background:var(--card);
    padding:15px; position:relative; overflow:hidden; transition:border-color .2s;
  }
  .card:hover{ border-color:var(--border-strong); }
  .card.flash-up{ animation:flashUp .7s ease; }
  .card.flash-down{ animation:flashDown .7s ease; }
  @keyframes flashUp{ 0%{ background:var(--up-soft);} 100%{ background:var(--card);} }
  @keyframes flashDown{ 0%{ background:var(--down-soft);} 100%{ background:var(--card);} }

  .card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .asset-id{ display:flex; align-items:center; gap:9px; }
  .asset-ic{
    width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:18px; background:var(--bg-soft); border:1px solid var(--border); flex-shrink:0;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
    line-height:1;
  }
  .asset-name{ font-size:12.5px; font-weight:700; line-height:1.3; }
  .asset-sym{ font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono'; }
  .chg{
    font-size:11px; font-family:'JetBrains Mono'; font-weight:600; padding:3px 7px; border-radius:6px; direction:ltr;
  }
  .chg.up{ color:var(--up); background:var(--up-soft); }
  .chg.down{ color:var(--down); background:var(--down-soft); }

  .card-price{ font-size:18px; font-weight:700; margin-bottom:3px; }
  .card-price small{ font-size:10.5px; font-weight:500; color:var(--text-faint); margin-right:4px; }
  .card-sub{ font-size:10.5px; color:var(--text-faint); margin-bottom:12px; height:14px; overflow:hidden; }

  .spark{ width:100%; height:30px; display:block; opacity:.9; }

  footer{
    max-width:1160px; margin:44px auto 0; padding:20px 24px; border:1px solid var(--border); border-radius:14px;
    color:var(--text-faint); font-size:11px; line-height:1.9; text-align:center;
    background:var(--card);
  }
  footer b{ color:var(--text-dim); }

  @media (prefers-reduced-motion: reduce){
    .ticker-track{ animation:none; }
    .card.flash-up, .card.flash-down{ animation:none; }
  }
</style>
</head>
<body>

  <div class="bg-fx" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-dots"></div>
    <div class="bg-glow"></div>
    <div class="bg-scan"></div>
  </div>

  <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

  <div class="header-wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">﷼</div>
      <div class="brand-text">
        <h1>میز ارز</h1>
        <span>بازار لحظه‌ای ارز و ارز دیجیتال</span>
      </div>
    </div>
    <div class="header-tools">
      <div class="search-box">
        <span style="opacity:.6">🔎</span>
        <input id="searchInput" type="text" placeholder="جست‌وجوی دلار، بیت‌کوین...">
      </div>
      <div class="clock-box">
        <div class="t num" id="clockTime">--:--:--</div>
        <div class="d" id="clockDate">در حال بارگذاری</div>
      </div>
      <button class="icon-btn" id="themeToggle" title="تغییر حالت شب/روز">🌙</button>
    </div>
  </header>
  </div>

  <main>
    <!-- HERO CONVERTER -->
    <section class="hero">
      <div class="hero-head">
        <h2><span class="dot"></span>مبدل لحظه‌ای ارز</h2>
        <span class="sub" id="liveStatus">در حال اتصال به منابع قیمت...</span>
      </div>

      <div class="conv-grid">
        <div class="conv-field">
          <label>از</label>
          <div class="conv-panel">
            <input type="text" id="amountFrom" class="num" value="1" inputmode="decimal">
            <div class="conv-select">
              <select id="selectFrom"></select>
            </div>
          </div>
        </div>

        <button class="swap-btn" id="swapBtn" title="جابه‌جایی">⇄</button>

        <div class="conv-field">
          <label>به</label>
          <div class="conv-panel">
            <input type="text" id="amountTo" class="num" value="0" readonly>
            <div class="conv-select">
              <select id="selectTo"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="rate-line">
        <div id="rateText">در حال محاسبه نرخ...</div>
        <div class="updated-tag"><span class="dotsm"></span><span id="lastTick">هم‌اکنون</span></div>
      </div>
    </section>

    <!-- CRYPTO -->
    <section class="block">
      <div class="section-head">
        <h3>ارزهای دیجیتال <span class="badge">CRYPTO</span></h3>
        <span class="count" id="cryptoCount"></span>
      </div>
      <div class="grid" id="cryptoGrid"></div>
    </section>

    <!-- FOREX -->
    <section class="block">
      <div class="section-head">
        <h3>ارزهای خارجی <span class="badge">FOREX</span></h3>
        <span class="count" id="forexCount"></span>
      </div>
      <div class="grid" id="forexGrid"></div>
    </section>
  </main>

  <footer>
    <span id="footNote">در حال اتصال به منابع قیمت...</span><br>
    ساخته شده تفننی توسط دکتر فرهان گلی
  </footer>

<script>
(function(){
  "use strict";

  // ---------------- asset definitions ----------------
  // forex: price stored directly in Toman per 1 unit
  // crypto: price stored in USD per 1 unit, converted via live USD/Toman rate
  const forex = [
    {id:'USD', name:'دلار آمریکا', flag:'🇺🇸', price:260000, vol:0.0010, base:0},
    {id:'EUR', name:'یورو',        flag:'🇪🇺', price:290600, vol:0.0012, base:0},
    {id:'GBP', name:'پوند انگلیس', flag:'🇬🇧', price:343100, vol:0.0013, base:0},
    {id:'AED', name:'درهم امارات', flag:'🇦🇪', price:70930,  vol:0.0009, base:0},
    {id:'TRY', name:'لیر ترکیه',   flag:'🇹🇷', price:5297,   vol:0.0030, base:0},
    {id:'CNY', name:'یوان چین',    flag:'🇨🇳', price:39000,  vol:0.0010, base:0},
    {id:'CAD', name:'دلار کانادا', flag:'🇨🇦', price:182300, vol:0.0011, base:0},
    {id:'SAR', name:'ریال سعودی',  flag:'🇸🇦', price:69440,  vol:0.0008, base:0},
  ];
  const crypto = [
    {id:'BTC', name:'بیت‌کوین',  ic:'₿', priceUsd:83400,   vol:0.0035, base:0},
    {id:'ETH', name:'اتریوم',    ic:'Ξ', priceUsd:2510,    vol:0.0045, base:0},
    {id:'USDT',name:'تتر',       ic:'₮', priceUsd:1.000,   vol:0.0004, base:0},
    {id:'BNB', name:'بایننس‌کوین',ic:'B', priceUsd:745,     vol:0.0040, base:0},
    {id:'SOL', name:'سولانا',    ic:'S', priceUsd:108,     vol:0.0060, base:0},
    {id:'XRP', name:'ریپل',      ic:'X', priceUsd:1.37,    vol:0.0055, base:0},
    {id:'ADA', name:'کاردانو',   ic:'A', priceUsd:0.235,   vol:0.0050, base:0},
    {id:'DOGE',name:'دوج‌کوین',  ic:'Ð', priceUsd:0.0848,   vol:0.0075, base:0},
  ];
  forex.forEach(a=>a.base=a.price);
  crypto.forEach(a=>a.base=a.priceUsd);

  const HIST_LEN = 24;
  [...forex, ...crypto].forEach(a=>{
    const p = a.price !== undefined ? a.price : a.priceUsd;
    a.hist = new Array(HIST_LEN).fill(p);
    a.changePct = 0;
    a.lastDir = 0;
  });

  function usdRate(){ return forex.find(f=>f.id==='USD').price; }

  function rialOf(kind, id){
    if(kind==='UNIT'){
      return id==='TOMAN' ? 10 : 1; // rial base
    }
    if(kind==='FOREX'){
      const f = forex.find(x=>x.id===id);
      return f.price * 10;
    }
    if(kind==='CRYPTO'){
      const c = crypto.find(x=>x.id===id);
      return c.priceUsd * usdRate() * 10;
    }
    return 0;
  }

  // ---------------- number formatting ----------------
  function fmt(n, maxDec){
    if(n===undefined || isNaN(n)) return '0';
    let dec = maxDec;
    if(dec===undefined){
      if(n >= 1000) dec = 0;
      else if(n >= 1) dec = 2;
      else if(n >= 0.01) dec = 4;
      else dec = 8;
    }
    return n.toLocaleString('en-US', {maximumFractionDigits:dec, minimumFractionDigits:0});
  }
  function humanizeToman(n){
    if(n >= 1e12) return (n/1e12).toFixed(2)+' هزار میلیارد تومان';
    if(n >= 1e9)  return (n/1e9).toFixed(2)+' میلیارد تومان';
    if(n >= 1e6)  return (n/1e6).toFixed(1)+' میلیون تومان';
    return fmt(n)+' تومان';
  }

  // ---------------- build UI: cards ----------------
  const cryptoGrid = document.getElementById('cryptoGrid');
  const forexGrid = document.getElementById('forexGrid');

  function sparkSvg(hist, up){
    const w=100,h=34, min=Math.min(...hist), max=Math.max(...hist);
    const range = (max-min)||1;
    const pts = hist.map((v,i)=>{
      const x = (i/(hist.length-1))*w;
      const y = h - ((v-min)/range)*h;
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    const color = up ? 'var(--up)' : 'var(--down)';
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function buildCard(asset, kind){
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = asset.id;
    el.dataset.name = asset.name;
    const icon = kind==='crypto' ? asset.ic : asset.flag;
    el.innerHTML = `
      <div class="card-top">
        <div class="asset-id">
          <div class="asset-ic">${icon}</div>
          <div>
            <div class="asset-name">${asset.name}</div>
            <div class="asset-sym">${asset.id}</div>
          </div>
        </div>
        <div class="chg up" data-role="chg">0.00%</div>
      </div>
      <div class="card-price num" data-role="price">0</div>
      <div class="card-sub" data-role="sub"></div>
      <div data-role="spark"></div>
    `;
    return el;
  }

  crypto.forEach(a=> cryptoGrid.appendChild(buildCard(a,'crypto')));
  forex.forEach(a=> forexGrid.appendChild(buildCard(a,'forex')));
  document.getElementById('cryptoCount').textContent = crypto.length + ' دارایی';
  document.getElementById('forexCount').textContent = forex.length + ' ارز';

  function renderCard(asset, kind){
    const el = document.querySelector(`.card[data-id="${asset.id}"]`);
    if(!el) return;
    const rial = rialOf(kind==='crypto'?'CRYPTO':'FOREX', asset.id);
    const toman = rial/10;
    const priceEl = el.querySelector('[data-role="price"]');
    const subEl = el.querySelector('[data-role="sub"]');
    const chgEl = el.querySelector('[data-role="chg"]');
    const sparkEl = el.querySelector('[data-role="spark"]');

    priceEl.innerHTML = fmt(toman) + ' <small>تومان</small>';
    if(kind==='crypto'){
      subEl.textContent = '$' + fmt(asset.priceUsd, asset.priceUsd<1?4:2) + '  ·  ' + humanizeToman(toman);
    } else {
      subEl.textContent = '۱ ' + asset.id + ' = ' + fmt(toman) + ' تومان';
    }
    const up = asset.changePct >= 0;
    chgEl.textContent = (up?'+':'') + asset.changePct.toFixed(2) + '%';
    chgEl.className = 'chg num ' + (up?'up':'down');
    sparkEl.innerHTML = sparkSvg(asset.hist, up);

    if(asset.lastDir !== 0){
      el.classList.remove('flash-up','flash-down');
      void el.offsetWidth;
      el.classList.add(asset.lastDir>0?'flash-up':'flash-down');
    }
  }

  // ---------------- ticker tape ----------------
  const tickerIds = ['USD','EUR','BTC','ETH','USDT','GBP','SOL','TRY'];
  function tickerAsset(id){
    return forex.find(f=>f.id===id) || crypto.find(c=>c.id===id);
  }
  function buildTicker(){
    const track = document.getElementById('tickerTrack');
    const list = tickerIds.map(id=>{
      const a = tickerAsset(id);
      const kind = forex.includes(a) ? 'forex':'crypto';
      const toman = rialOf(kind==='crypto'?'CRYPTO':'FOREX', a.id)/10;
      const up = a.changePct>=0;
      return `<span class="ticker-item"><b>${a.id}</b><span class="num">${fmt(toman)} ت</span><span class="${up?'chg-up':'chg-down'} num">${up?'▲':'▼'} ${Math.abs(a.changePct).toFixed(2)}%</span></span>`;
    }).join('');
    track.innerHTML = list + list; // duplicate for seamless loop
  }

  // ---------------- converter ----------------
  const selFrom = document.getElementById('selectFrom');
  const selTo = document.getElementById('selectTo');
  const amountFrom = document.getElementById('amountFrom');
  const amountTo = document.getElementById('amountTo');
  const rateText = document.getElementById('rateText');

  function optionList(){
    let html = '<optgroup label="واحد ریالی">';
    html += `<option value="UNIT:TOMAN">تومان</option>`;
    html += `<option value="UNIT:IRR">ریال</option>`;
    html += '</optgroup><optgroup label="ارز دیجیتال">';
    crypto.forEach(a=> html += `<option value="CRYPTO:${a.id}">${a.name} (${a.id})</option>`);
    html += '</optgroup><optgroup label="ارز خارجی">';
    forex.forEach(a=> html += `<option value="FOREX:${a.id}">${a.name} (${a.id})</option>`);
    html += '</optgroup>';
    return html;
  }
  selFrom.innerHTML = optionList();
  selTo.innerHTML = optionList();
  selFrom.value = 'CRYPTO:BTC';
  selTo.value = 'UNIT:TOMAN';

  function parseSel(v){ const [kind,id] = v.split(':'); return {kind,id}; }
  function labelOf(kind,id){
    if(kind==='UNIT') return id==='TOMAN'?'تومان':'ریال';
    if(kind==='CRYPTO') return crypto.find(a=>a.id===id).name;
    return forex.find(a=>a.id===id).name;
  }

  function updateConverter(){
    const from = parseSel(selFrom.value);
    const to = parseSel(selTo.value);
    const amt = parseFloat((amountFrom.value||'0').replace(/,/g,'')) || 0;
    const fromRial = rialOf(from.kind, from.id);
    const toRial = rialOf(to.kind, to.id);
    const result = toRial>0 ? (amt * fromRial) / toRial : 0;
    let dec = result>=1000?2:(result>=1?4:8);
    amountTo.value = fmt(result, dec);

    const oneRate = fromRial/toRial;
    rateText.innerHTML = `۱ <b>${labelOf(from.kind,from.id)}</b> = <span class="num">${fmt(oneRate, oneRate>=1000?0:6)}</span> <b>${labelOf(to.kind,to.id)}</b>`;
  }

  selFrom.addEventListener('change', updateConverter);
  selTo.addEventListener('change', updateConverter);
  amountFrom.addEventListener('input', ()=>{
    amountFrom.value = amountFrom.value.replace(/[^0-9.]/g,'');
    updateConverter();
  });
  document.getElementById('swapBtn').addEventListener('click', ()=>{
    const f = selFrom.value; selFrom.value = selTo.value; selTo.value = f;
    updateConverter();
  });

  // ---------------- search filter ----------------
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(card=>{
      const hit = card.dataset.name.toLowerCase().includes(q) || card.dataset.id.toLowerCase().includes(q);
      card.style.display = hit ? '' : 'none';
    });
  });

  // ---------------- theme toggle ----------------
  const themeBtn = document.getElementById('themeToggle');
  themeBtn.addEventListener('click', ()=>{
    const root = document.documentElement;
    const next = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    themeBtn.textContent = next==='dark' ? '🌙' : '☀️';
  });

  // ---------------- clock ----------------
  function tickClock(){
    const now = new Date();
    const time = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Tehran', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}).format(now);
    const date = new Intl.DateTimeFormat('fa-IR', {timeZone:'Asia/Tehran', weekday:'long', day:'numeric', month:'long'}).format(now);
    document.getElementById('clockTime').textContent = time;
    document.getElementById('clockDate').textContent = date + ' - تهران';
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------------- live data layer (real APIs + simulation fallback) ----------------
  const LIVE_TTL = 120000; // data older than 2 min counts as stale -> fall back to simulation
  const src = { crypto:{ok:false, at:0}, fx:{ok:false, at:0}, usd:{ok:false, at:0}, iran:{ok:false, at:0} };
  let iranRates = null;
  let fxRates = null;
  const fresh = s => s.ok && (Date.now() - s.at) < LIVE_TTL;

  const cgIds = {BTC:'bitcoin',ETH:'ethereum',USDT:'tether',BNB:'binancecoin',SOL:'solana',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin'};

  async function fj(url, opts){
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 9000);
    try{
      const r = await fetch(url, Object.assign({signal: ctl.signal}, opts||{}));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  function applyLive(asset, key, value){
    if(!(value > 0) || !isFinite(value)) return;
    const prev = asset[key];
    if(!asset.live){
      asset.base = value;
      asset.hist = new Array(HIST_LEN).fill(value);
      asset.lastDir = 0;
    } else {
      asset.hist.push(value);
      if(asset.hist.length > HIST_LEN) asset.hist.shift();
      asset.lastDir = value > prev ? 1 : (value < prev ? -1 : 0);
    }
    asset[key] = value;
    asset.changePct = ((value - asset.base) / asset.base) * 100;
    asset.live = true;
    asset.liveAt = Date.now();
  }

  async function fetchCrypto(){
    try{
      const ids = Object.values(cgIds).join(',');
      const d = await fj('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd');
      let n = 0;
      crypto.forEach(c=>{ const v = d[cgIds[c.id]] && d[cgIds[c.id]].usd; if(v>0){ applyLive(c,'priceUsd',v); n++; } });
      if(!n) throw new Error('empty');
      src.crypto = {ok:true, at:Date.now()};
    }catch(e1){
      try{
        const fs = crypto.map(c=>c.id).join(',');
        const d = await fj('https://min-api.cryptocompare.com/data/pricemulti?fsyms='+fs+'&tsyms=USD');
        let n = 0;
        crypto.forEach(c=>{ const v = d[c.id] && d[c.id].USD; if(v>0){ applyLive(c,'priceUsd',v); n++; } });
        if(!n) throw new Error('empty');
        src.crypto = {ok:true, at:Date.now()};
      }catch(e1b){
      try{
        const syms = ['BTC','ETH','BNB','SOL','XRP','ADA','DOGE'].map(s=>s+'USDT');
        const d = await fj('https://api.binance.com/api/v3/ticker/price?symbols='+encodeURIComponent(JSON.stringify(syms)));
        d.forEach(row=>{
          const id = row.symbol.replace('USDT','');
          const c = crypto.find(x=>x.id===id);
          if(c) applyLive(c,'priceUsd',parseFloat(row.price));
        });
        src.crypto = {ok:true, at:Date.now()};
      }catch(e2){ src.crypto.ok = false; }
      }
    }
    refreshAll();
  }

  async function fetchFx(){
    try{
      const d = await fj('https://open.er-api.com/v6/latest/USD');
      if(d && d.rates){ fxRates = d.rates; src.fx = {ok:true, at:Date.now()}; }
    }catch(e){ src.fx.ok = false; }
    refreshAll();
  }

  function normToman(v){
    v = parseFloat(v);
    if(!isFinite(v)) return null;
    if(v > 1e6) v = v/10;               // value was in Rial
    return (v > 20000 && v < 2e6) ? v : null; // sanity range
  }

  async function fetchUsdToman(){
    const tries = [
      async()=>{ const d = await fj('https://api.nobitex.ir/v3/orderbook/USDTIRT'); return normToman(d.lastTradePrice); },
      async()=>{ const d = await fj('https://api.nobitex.ir/market/stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({srcCurrency:'usdt',dstCurrency:'rls'})}); return normToman(d.stats['usdt-rls'].latest); },
      async()=>{ const d = await fj('https://api.wallex.ir/v1/markets'); return normToman(d.result.symbols.USDTTMN.stats.lastPrice); },
    ];
    // tgju: returns many Iranian-market rates (in Rial) in one call; try directly, then via a CORS relay
    const tgjuParse = (d)=>{
      const cur = d && d.current; if(!cur) return null;
      const g = k => cur[k] && cur[k].p ? normToman(String(cur[k].p).replace(/,/g,'')) : null;
      return { USD:g('price_dollar_rl'), EUR:g('price_eur'), GBP:g('price_gbp'), AED:g('price_aed'),
               TRY:g('price_try'), CNY:g('price_cny'), CAD:g('price_cad'), SAR:g('price_sar') };
    };
    const tgjuTry = async(url)=>{
      const d = await fj(url);
      const r = tgjuParse(d);
      if(!r || !r.USD) throw new Error('no usd');
      iranRates = r; src.iran = {ok:true, at:Date.now()};
      return r.USD;
    };
    tries.unshift(
      ()=>tgjuTry('https://call5.tgju.org/ajax.json'),
      ()=>tgjuTry('https://api.allorigins.win/raw?url='+encodeURIComponent('https://call5.tgju.org/ajax.json'))
    );
    for(const t of tries){
      try{
        const v = await t();
        if(v){
          applyLive(forex.find(f=>f.id==='USD'),'price',v);
          src.usd = {ok:true, at:Date.now()};
          refreshAll();
          return;
        }
      }catch(e){ /* try next source */ }
    }
    src.usd.ok = false;
    refreshAll();
  }

  // ---------------- status text ----------------
  function updateStatus(){
    const lc = fresh(src.crypto), lf = fresh(src.fx) || fresh(src.iran), lu = fresh(src.usd);
    const tag = (ok)=> ok ? 'زنده' : 'شبیه‌سازی';
    const el = document.getElementById('liveStatus');
    const foot = document.getElementById('footNote');
    if(lc && lf && lu){
      el.textContent = '🟢 همه‌ی قیمت‌ها زنده و از بازار گرفته می‌شوند';
    } else if(lc || lf || lu){
      el.textContent = '🟡 کریپتو: '+tag(lc)+' · ارزها: '+tag(lf)+' · دلار به تومان: '+tag(lu);
    } else {
      el.textContent = '🔴 اتصال به منابع قیمت برقرار نیست؛ قیمت‌ها شبیه‌سازی می‌شوند';
    }
    if(lc || lf || lu){
      foot.innerHTML = 'منبع داده‌ها: کریپتو از <b>CoinGecko</b> (یا CryptoCompare/Binance)، دلار و ارزهای بازار ایران از <b>TGJU</b> و در صورت قطع بودن از قیمت تتر در <b>نوبیتکس/والکس</b>، و نرخ جهانی ارزها از <b>open.er-api.com</b>. بخش‌هایی که متصل نیستند به‌صورت شبیه‌سازی نمایش داده می‌شوند. برای تصمیم‌های مالی از منابع رسمی بازار استفاده کنید.';
    } else {
      foot.innerHTML = 'در حال حاضر داده‌ها به‌صورت <b>شبیه‌سازی زنده</b> هستند (اتصال به منابع قیمت برقرار نشد) و صرفاً جنبه‌ی نمایشی دارند.';
    }
  }

  // ---------------- simulation fallback ----------------
  let secsSinceTick = 0;
  function randWalk(asset, key){
    const cur = asset[key];
    let spike = (Math.random() < 0.06) ? 3.2 : 1;
    const delta = (Math.random()-0.5) * 2 * asset.vol * spike;
    let next = cur * (1 + delta);
    if(next <= 0) next = cur;
    asset[key] = next;
    asset.hist.push(next);
    if(asset.hist.length > HIST_LEN) asset.hist.shift();
    asset.lastDir = next > cur ? 1 : (next < cur ? -1 : 0);
    asset.changePct = ((next - asset.base) / asset.base) * 100;
  }

  function stepPrices(){
    const usd = forex.find(f=>f.id==='USD');
    // USD/Toman
    if(!(usd.live && fresh(src.usd))){ usd.live = false; randWalk(usd,'price'); }
    // other fiat: derived from live cross rates when available
    forex.forEach(a=>{
      if(a.id==='USD') return;
      if(iranRates && fresh(src.iran) && iranRates[a.id] > 0){
        applyLive(a,'price', iranRates[a.id]);
      } else if(fxRates && fresh(src.fx) && fxRates[a.id] > 0){
        applyLive(a,'price', usd.price / fxRates[a.id]);
      } else { a.live = false; randWalk(a,'price'); }
    });
    // crypto
    crypto.forEach(a=>{
      if(a.live && fresh(src.crypto)) return;
      a.live = false; randWalk(a,'priceUsd');
    });
  }

  function refreshAll(){
    stepPrices();
    crypto.forEach(a=> renderCard(a,'crypto'));
    forex.forEach(a=> renderCard(a,'forex'));
    buildTicker();
    updateConverter();
    updateStatus();
    secsSinceTick = 0;
    document.getElementById('lastTick').textContent = 'هم‌اکنون به‌روزرسانی شد';
  }

  function tickAgeLoop(){
    secsSinceTick++;
    document.getElementById('lastTick').textContent = secsSinceTick + ' ثانیه پیش';
  }

  // initial paint, then go live
  crypto.forEach(a=> renderCard(a,'crypto'));
  forex.forEach(a=> renderCard(a,'forex'));
  buildTicker();
  updateConverter();
  updateStatus();

  fetchUsdToman(); fetchCrypto(); fetchFx();
  setInterval(fetchUsdToman, 10000);
  setInterval(fetchCrypto, 10000);
  setInterval(fetchFx, 300000);
  setInterval(refreshAll, 2500);   // keeps simulated parts moving and re-checks freshness
  setInterval(tickAgeLoop, 1000);

})();
</script>
</body>
</html>
